[project]
name = "url-shortener-drf"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Dhanshree019", email = "dhanshree.patangrao@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "dj-database-url>=3.1.2",
    "django>=6.1.2",
    "django-redis>=7.0.0",
    "djangorestframework>=3.18.3",
    "gunicorn>=26.2.0",
    "locust>=2.46.7",
    "psycopg[binary]>=3.3.6",
]

[project.scripts]
url-shortener-drf = "url_shortener_drf:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"
